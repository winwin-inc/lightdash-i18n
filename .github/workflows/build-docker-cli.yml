name: Build & Deploy to ALIYUN - CLI tool image

on:
    workflow_dispatch:
    push:
        tags:
            - 'cli-v*'

env:
    REGISTRY: registry.cn-hangzhou.aliyuncs.com
    # 与主站 winwin/lightdash、MCP 分离；推送到已有 winwin/tool
    REGISTRY_IMAGE: registry.cn-hangzhou.aliyuncs.com/winwin/tool

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Resolve image tags
              id: vars
              shell: bash
              env:
                  REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
              run: |
                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    VERSION="${GITHUB_REF_NAME#cli-v}"
                    if [[ -z "${VERSION}" ]]; then
                      echo "Invalid tag: expected cli-vX.Y.Z, got ${GITHUB_REF_NAME}"
                      exit 1
                    fi
                    # 只推带版本 tag，不覆盖历史 lightdash-cli / lightdash-cli-0.2091.2
                    {
                      echo "tags<<EOF"
                      echo "${REGISTRY_IMAGE}:lightdash-cli-${VERSION}"
                      echo "EOF"
                    } >> "${GITHUB_OUTPUT}"
                    echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
                  else
                    VERSION="sha-${GITHUB_SHA::12}"
                    {
                      echo "tags<<EOF"
                      echo "${REGISTRY_IMAGE}:lightdash-cli-${VERSION}"
                      echo "EOF"
                    } >> "${GITHUB_OUTPUT}"
                    echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
                  fi

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Aliyun Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            - name: Build and push CLI tool image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: packages/cli/Dockerfile
                  platforms: linux/amd64
                  push: true
                  provenance: false
                  build-args: |
                      VERSION=${{ steps.vars.outputs.version }}
                  tags: ${{ steps.vars.outputs.tags }}
                  labels: |
                      org.opencontainers.image.title=lightdash-cli
                      org.opencontainers.image.version=${{ steps.vars.outputs.version }}
                      org.opencontainers.image.revision=${{ github.sha }}

    # tag 推送时并行：打独立 tgz 并挂到同名 GitHub Release（不标 Latest）
    release-tgz:
        if: github.ref_type == 'tag'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PNPM
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'

            - name: Install packages
              run: pnpm install --frozen-lockfile --prefer-offline

            - name: Assert tag version matches package.json
              shell: bash
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
                  PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
                  if [[ -z "${TAG_VERSION}" ]]; then
                    echo "Invalid tag: expected cli-vX.Y.Z, got ${GITHUB_REF_NAME}"
                    exit 1
                  fi
                  if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
                    echo "tag ${GITHUB_REF_NAME} != packages/cli/package.json version ${PKG_VERSION}"
                    echo "先 pnpm bump-version -- ${TAG_VERSION} 再打 cli tag。"
                    exit 1
                  fi
                  echo "version=${PKG_VERSION}"

            - name: Build CLI
              run: |
                  pnpm common-build
                  pnpm warehouses-build
                  pnpm cli-build

            - name: Pack standalone tgz
              run: pnpm -F cli pack:standalone

            - name: Smoke test bundled CLI
              run: |
                  node packages/cli/bundle/index.js --version
                  node packages/cli/bundle/index.js lint --help

            - name: Upload tgz to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  make_latest: false
                  fail_on_unmatched_files: true
                  files: packages/cli/release/lightdash-cli-*.tgz
