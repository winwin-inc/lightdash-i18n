name: Release msy-x-cli tgz

on:
    workflow_dispatch:
    push:
        tags:
            - 'msyx-v*'

permissions:
    contents: write

jobs:
    release-tgz:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PNPM
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'

            - name: Install packages
              run: pnpm install --frozen-lockfile --prefer-offline

            - name: Resolve version and assert tag matches package.json
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
                    VERSION="${GITHUB_REF_NAME#msyx-v}"
                    TAG_NAME="${GITHUB_REF_NAME}"
                  else
                    VERSION="$(node -p "require('./packages/msy-x-cli/package.json').version")"
                    TAG_NAME="msyx-v${VERSION}"
                  fi
                  if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "非法版本号: ${VERSION}（tag 需形如 msyx-vX.Y.Z）"
                    exit 1
                  fi
                  PKG_VERSION="$(node -p "require('./packages/msy-x-cli/package.json').version")"
                  if [[ "${VERSION}" != "${PKG_VERSION}" ]]; then
                    echo "tag ${TAG_NAME} != packages/msy-x-cli/package.json version ${PKG_VERSION}"
                    echo "先 pnpm bump-msyx -- ${VERSION} 再打 tag。"
                    exit 1
                  fi
                  echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
                  echo "TAG_NAME=${TAG_NAME}" >> "${GITHUB_ENV}"
                  echo "version=${VERSION} tag=${TAG_NAME}"

            - name: Build CLI and pack tgz
              run: |
                  pnpm -F msy-x-cli build
                  pnpm -F msy-x-cli pack:tgz

            - name: Smoke test packed tgz (防 tslib 类打包事故)
              shell: bash
              run: |
                  TGZ="packages/msy-x-cli/dist-msy-x/msy-x-cli-${VERSION}.tgz"
                  if [ ! -f "${TGZ}" ]; then
                    echo "未找到 ${TGZ}（pack:tgz 失败？）"
                    exit 1
                  fi
                  rm -rf /tmp/msy-x
                  npm i -g --prefix /tmp/msy-x "./${TGZ}"
                  OUT="$(/tmp/msy-x/bin/msy-x --version)"
                  echo "--version: ${OUT}"
                  [ "${OUT}" = "msy-x ${VERSION}" ] || { echo "--version 输出与预期不符"; exit 1; }
                  /tmp/msy-x/bin/msy-x --help | grep -q "auth" || { echo "--help 输出不含 auth"; exit 1; }
                  # 本地检查，不联网：MSY_X_CONFIG 指向不存在的文件，doctor 只跑本地项
                  MSY_X_CONFIG=/tmp/none.yaml /tmp/msy-x/bin/msy-x doctor
                  echo "smoke ok"

            # 先算 URL，再上传：upload 脚本对同版本对象拒绝覆盖，
            # 地址口径要提前确定，避免上传成功但地址与后续校验不一致。
            - name: Resolve public URL
              env:
                  CDN_PATH_PREFIX: ${{ vars.CDN_PATH_PREFIX || secrets.CDN_PATH_PREFIX || 'msy-x' }}
                  CDN_BASE_URL: ${{ vars.CDN_BASE_URL || secrets.CDN_BASE_URL }}
              run: |
                  BASE_URL="${CDN_BASE_URL:-https://img0.banmahui.cn}"
                  BASE_URL="${BASE_URL%/}"
                  CDN_UPLOAD_PATH="msy-x/cli/msy-x-cli/${VERSION}"
                  PUBLIC_URL="${BASE_URL}/${CDN_UPLOAD_PATH}/msy-x-cli-${VERSION}.tgz"
                  echo "CDN_UPLOAD_PATH=${CDN_UPLOAD_PATH}" >> "${GITHUB_ENV}"
                  echo "PUBLIC_URL=${PUBLIC_URL}" >> "${GITHUB_ENV}"
                  echo "公开安装地址：${PUBLIC_URL}"

            - name: Upload tgz to OSS/CDN
              env:
                  CDN_PROVIDER: ${{ vars.CDN_PROVIDER || secrets.CDN_PROVIDER || 'aliyun' }}
                  S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
                  S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
                  S3_REGION: ${{ vars.S3_REGION || secrets.S3_REGION }}
                  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY || vars.S3_ACCESS_KEY }}
                  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY || vars.S3_SECRET_KEY }}
                  CDN_PATH_PREFIX: ${{ vars.CDN_PATH_PREFIX || secrets.CDN_PATH_PREFIX || 'msy-x' }}
                  CDN_BASE_URL: ${{ vars.CDN_BASE_URL || secrets.CDN_BASE_URL }}
              run: |
                  export VERSION
                  export CLI_NAME=msy-x-cli
                  export CLI_TGZ="packages/msy-x-cli/dist-msy-x/msy-x-cli-${VERSION}.tgz"
                  export CDN_UPLOAD_PATH="${CDN_UPLOAD_PATH}"
                  if [ -z "$S3_BUCKET" ] || [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
                    echo "OSS 密钥缺失（S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY）；npm 全局安装必须走公网 tgz，不能只挂 GitHub Release。"
                    echo "期望基线：S3_BUCKET=qmgy-report（k8s-config master lightdash 同桶）、CDN_PATH_PREFIX=msy-x、CDN_BASE_URL=https://img0.banmahui.cn（配置在 repo vars 或 secrets）"
                    exit 1
                  fi
                  bash scripts/upload-cli-tgz-to-cdn.sh | tee /tmp/msy-x-upload.log
                  UPLOADED_URL="$(grep -m1 '^Public install URL: ' /tmp/msy-x-upload.log | sed 's/^Public install URL: //')"
                  if [ -z "${UPLOADED_URL}" ]; then
                    echo "未能从 upload-cli-tgz-to-cdn.sh 输出解析出 Public install URL"
                    exit 1
                  fi
                  if [ "${UPLOADED_URL}" != "${PUBLIC_URL}" ]; then
                    echo "上传地址与门禁地址不一致（脚本/工作流口径漂移）："
                    echo "  脚本：${UPLOADED_URL}"
                    echo "  门禁：${PUBLIC_URL}"
                    exit 1
                  fi

            - name: Smoke test CDN anonymous access（npm 全局安装前提）
              run: |
                  SMOKE_URL="${PUBLIC_URL}"
                  HTTP_CODE=""
                  for i in 1 2 3; do
                    HTTP_CODE="$(curl -sSI --max-time 60 -o /tmp/msy-x-cdn-head.txt -w '%{http_code}' "${SMOKE_URL}" || true)"
                    if [ "${HTTP_CODE}" = "200" ]; then break; fi
                    echo "第 ${i} 次探测 ${SMOKE_URL} -> HTTP ${HTTP_CODE:-连接失败}，10s 后重试"
                    sleep 10
                  done
                  if [ "${HTTP_CODE}" != "200" ]; then
                    echo "CDN 匿名访问 ${SMOKE_URL} 返回 HTTP ${HTTP_CODE:-<无响应>}（期望 200）"
                    echo "npm install -g <url> 要求匿名可读；失败请检查 CDN 回源与缓存配置。"
                    echo "期望基线：S3_BUCKET=qmgy-report、CDN_PATH_PREFIX=msy-x、CDN_BASE_URL=https://img0.banmahui.cn"
                    exit 1
                  fi
                  if ! grep -qi '^content-type: *application/gzip' /tmp/msy-x-cdn-head.txt; then
                    echo "CDN 响应 content-type 不是 application/gzip："
                    grep -i '^content-type:' /tmp/msy-x-cdn-head.txt || echo "（响应无 content-type）"
                    echo "npm 按 content-type 判断包类型；请检查 CDN 回源是否保留 OSS 对象的 Content-Type 元数据。"
                    exit 1
                  fi
                  echo "CDN 匿名可读冒烟通过：${SMOKE_URL} -> 200 application/gzip"

            - name: Upload tgz to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.TAG_NAME }}
                  name: ${{ env.TAG_NAME }}
                  make_latest: false
                  fail_on_unmatched_files: true
                  files: |
                      packages/msy-x-cli/dist-msy-x/msy-x-cli-*.tgz
                      packages/msy-x-cli/dist-msy-x/msy-x-cli-*.tgz.sha256

            - name: Write step summary
              env:
                  S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
                  CDN_PATH_PREFIX: ${{ vars.CDN_PATH_PREFIX || secrets.CDN_PATH_PREFIX || 'msy-x' }}
                  CDN_BASE_URL: ${{ vars.CDN_BASE_URL || secrets.CDN_BASE_URL }}
              run: |
                  SHA256="$(cut -d' ' -f1 "packages/msy-x-cli/dist-msy-x/msy-x-cli-${VERSION}.tgz.sha256")"
                  BASE_URL="${CDN_BASE_URL:-https://img0.banmahui.cn}"
                  BASE_URL="${BASE_URL%/}"
                  {
                    echo "## msy-x-cli ${VERSION}"
                    echo ""
                    echo "- 版本：\`${VERSION}\`（tag \`${TAG_NAME}\`）"
                    echo "- sha256：\`${SHA256}\`"
                    echo "- 安装：\`npm i -g ${PUBLIC_URL}\`"
                    echo "- OSS：bucket \`${S3_BUCKET}\`，prefix \`${CDN_PATH_PREFIX}\`，对象路径 \`${CDN_UPLOAD_PATH}/msy-x-cli-${VERSION}.tgz\`"
                    echo ""
                    echo "Actions 配置基线（repo vars 或 secrets）：\`S3_BUCKET=qmgy-report\`、\`CDN_PATH_PREFIX=msy-x\`、\`CDN_BASE_URL=https://img0.banmahui.cn\`"
                  } >> "${GITHUB_STEP_SUMMARY}"
